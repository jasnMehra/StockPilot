{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}{% block crumb %}<a href="{{ url_for('products') }}">Inventory</a> / {{ title }}{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">PRODUCT CATALOG</div><h1>{{ title }}</h1><p>Enter the product details below.</p></div><a class="btn light" href="{{ url_for('products') }}">← Back to inventory</a></div>
<section class="panel form-panel"><form method="post" class="form-grid">
<label class="field full"><span>Product name <b>*</b></span><input name="name" required maxlength="120" value="{{ product.name if product else request.form.get('name','') }}" placeholder="e.g. Wireless keyboard"></label>
<label class="field"><span>SKU <b>*</b></span><input name="sku" required maxlength="40" value="{{ product.sku if product else request.form.get('sku','') }}" placeholder="e.g. KEY-001"></label>
<label class="field"><span>Category</span><input name="category" maxlength="80" value="{{ product.category if product else request.form.get('category','') }}" placeholder="e.g. Accessories"></label>
<label class="field"><span>Unit price ($)</span><input name="price" type="number" min="0" step="0.01" required value="{{ product.price if product else request.form.get('price','0.00') }}"></label>
<label class="field"><span>Quantity</span><input name="quantity" type="number" min="0" step="1" required value="{{ product.quantity if product else request.form.get('quantity','0') }}"></label>
<label class="field"><span>Low-stock threshold</span><input name="low_stock_threshold" type="number" min="0" step="1" required value="{{ product.low_stock_threshold if product else request.form.get('low_stock_threshold','5') }}"><small>Show a low-stock warning at or below this quantity.</small></label>
<div class="form-actions full"><a class="btn light" href="{{ url_for('products') }}">Cancel</a><button class="btn primary" type="submit">{{ 'Save changes' if product else 'Create product' }}</button></div>
</form></section>
{% endblock %}
